name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  macos-universal:
    name: macOS universal DMG
    needs: validate
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # 均可选：完整配置签名 secrets 才使用 Developer ID；完整配置公证
      # secrets 才启用 Apple notarization。未提供签名配置时使用临时签名。
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: 校验 tag 与可选签名/公证配置
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} 必须与 package.json 版本 v${version} 一致。"
            exit 1
          fi

          signing=0
          notarizing=0
          if [[ -n "${APPLE_CERTIFICATE}" || -n "${APPLE_CERTIFICATE_PASSWORD}" || -n "${APPLE_SIGNING_IDENTITY}" ]]; then
            if [[ -z "${APPLE_CERTIFICATE}" || -z "${APPLE_CERTIFICATE_PASSWORD}" || -z "${APPLE_SIGNING_IDENTITY}" ]]; then
              echo "签名配置不完整：需要 APPLE_CERTIFICATE、APPLE_CERTIFICATE_PASSWORD、APPLE_SIGNING_IDENTITY。"
              exit 1
            fi
            signing=1
          fi

          if [[ -n "${APPLE_ID}" || -n "${APPLE_PASSWORD}" || -n "${APPLE_TEAM_ID}" ]]; then
            if [[ -z "${APPLE_ID}" || -z "${APPLE_PASSWORD}" || -z "${APPLE_TEAM_ID}" ]]; then
              echo "公证配置不完整：需要 APPLE_ID、APPLE_PASSWORD、APPLE_TEAM_ID。"
              exit 1
            fi
            if [[ "${signing}" != 1 ]]; then
              echo "公证前必须完整配置 Developer ID 签名 secrets。"
              exit 1
            fi
            notarizing=1
          fi

          {
            echo "signing=${signing}"
            echo "notarizing=${notarizing}"
            echo "dmg_path=src-tauri/target/universal-apple-darwin/release/bundle/dmg/PromptDock_${version}_universal.dmg"
          } >> "${GITHUB_ENV}"

      - name: 构建 universal DMG
        shell: bash
        run: |
          set -euo pipefail
          # Tauri treats empty exported Apple credentials as configured.
          if [[ "${signing}" == 0 ]]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
            export APPLE_SIGNING_IDENTITY=-
          fi
          if [[ "${notarizing}" == 0 ]]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          pnpm tauri:build:dmg

      - name: 验证 DMG 完整性、双架构与应用签名
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "${dmg_path}" ]]; then
            echo "未找到当前版本的 universal DMG：${dmg_path}"
            exit 1
          fi
          hdiutil verify "${dmg_path}"
          # CI 构建会在 DMG 完成后清理中间 .app，必须验证最终 DMG 内的应用，
          # 而不是已经不存在、且可能与安装包内容不同的 bundle/macos 路径。
          mount_dir="$(mktemp -d /tmp/promptdock-release-verify.XXXXXX)"
          cleanup() {
            hdiutil detach "${mount_dir}" >/dev/null 2>&1 || true
            rmdir "${mount_dir}" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "${mount_dir}" "${dmg_path}"
          app="${mount_dir}/PromptDock.app"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${app}/Contents/Info.plist")"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "安装包版本 v${version} 与发布 tag ${GITHUB_REF_NAME} 不一致。"
            exit 1
          fi
          lipo "${app}/Contents/MacOS/promptdock" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "${app}"
          signature="$(codesign --display --verbose=2 "${app}" 2>&1)"
          if [[ "${signing}" == 1 ]]; then
            grep -q '^Authority=Developer ID Application:' <<< "${signature}"
          else
            grep -q '^Signature=adhoc$' <<< "${signature}"
          fi
          if [[ "${notarizing}" == 1 ]]; then
            xcrun stapler validate "${app}"
          fi

      - name: 收集 DMG 并生成 SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp "${dmg_path}" release-artifacts/
          (cd release-artifacts && shasum -a 256 "${dmg_path##*/}" > SHA256SUMS.txt)
          {
            echo "PromptDock ${GITHUB_REF_NAME}（macOS universal，Apple Silicon + Intel）"
            echo
            echo "完整更新记录：https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md"
            echo
            if [[ "${signing}" == 1 ]]; then
              echo "- Developer ID 签名已通过 codesign 验证。"
            else
              echo "- 应用已通过临时签名验证，未使用 Apple Developer ID 签名。"
            fi
            if [[ "${notarizing}" == 1 ]]; then
              echo "- Apple 公证票据已通过 stapler validate 验证。"
            else
              echo "- 未配置 Apple 公证 secrets；产物未经 notarization。"
            fi
          } > release-artifacts/RELEASE_NOTES.md

      - name: 发布 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "release-artifacts/${dmg_path##*/}" \
            release-artifacts/SHA256SUMS.txt \
            --verify-tag \
            --title "PromptDock ${GITHUB_REF_NAME}" \
            --notes-file release-artifacts/RELEASE_NOTES.md
